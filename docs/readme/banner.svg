<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="RetailSync — Build your store, power your sales">
  <defs>
    <style>
      @font-face{font-family:Modak;src:url(data:font/woff2;base64,) format('woff2')}
      .title{font-family:Modak,'Arial Black',Impact,sans-serif;font-size:132px;fill:#fdfaf6}
      .tag{font-family:Inter,Helvetica,Arial,sans-serif;font-weight:800;font-size:22px;letter-spacing:4px;fill:#a7f432}
      .chip{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-weight:700;font-size:15px;fill:#1a1918}
      .bolt{animation:flash 2.4s ease-in-out infinite}
      .float{animation:bob 4s ease-in-out infinite}
      @keyframes flash{0%,100%{opacity:1}50%{opacity:.35}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#fdfaf6" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#1a1918"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>
  <rect x="6" y="6" width="1188" height="348" rx="24" fill="none" stroke="#fdfaf6" stroke-opacity=".12" stroke-width="2"/>

  <text x="70" y="180" class="title">RetailSync</text>
  <!-- thunder underline -->
  <polyline class="bolt" points="74,206 150,194 132,214 230,198 210,220 330,202" fill="none" stroke="#a7f432" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="74" y="262" class="tag">BUILD YOUR STORE · POWER YOUR SALES</text>

  <g transform="translate(74 290)">
    <rect width="150" height="34" rx="17" fill="#ff5c35" stroke="#fdfaf6" stroke-width="2"/>
    <text x="75" y="22" text-anchor="middle" class="chip">POSTGRESQL</text>
    <rect x="164" width="110" height="34" rx="17" fill="#a7f432" stroke="#fdfaf6" stroke-width="2"/>
    <text x="219" y="22" text-anchor="middle" class="chip">KAFKA</text>
    <rect x="288" width="150" height="34" rx="17" fill="#ffd600" stroke="#fdfaf6" stroke-width="2"/>
    <text x="363" y="22" text-anchor="middle" class="chip">OPENSEARCH</text>
    <rect x="452" width="140" height="34" rx="17" fill="#00e5ff" stroke="#fdfaf6" stroke-width="2"/>
    <text x="522" y="22" text-anchor="middle" class="chip">RAZORPAY</text>
  </g>

  <!-- stacked store cards -->
  <g class="float">
    <g transform="translate(860 70) rotate(-8)">
      <rect width="230" height="200" rx="22" fill="#ffd600" stroke="#fdfaf6" stroke-width="4"/>
    </g>
    <g transform="translate(880 80) rotate(4)">
      <rect width="230" height="200" rx="22" fill="#a7f432" stroke="#fdfaf6" stroke-width="4"/>
    </g>
    <g transform="translate(870 90)">
      <rect width="230" height="200" rx="22" fill="#ff5c35" stroke="#fdfaf6" stroke-width="4"/>
      <rect x="22" y="22" width="186" height="96" rx="14" fill="#fdfaf6"/>
      <text x="115" y="88" text-anchor="middle" font-size="56">🛍️</text>
      <rect x="22" y="134" width="120" height="14" rx="7" fill="#1a1918"/>
      <rect x="22" y="158" width="80" height="12" rx="6" fill="#1a1918" opacity=".5"/>
      <circle cx="186" cy="160" r="20" fill="#1a1918"/>
      <text x="186" y="167" text-anchor="middle" font-family="Inter,Arial" font-weight="800" font-size="20" fill="#a7f432">+</text>
    </g>
  </g>
</svg>
