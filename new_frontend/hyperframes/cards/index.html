<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"index","type":"number","label":"Index","default":0},
    {"id":"first","type":"string","label":"First name","default":"Alex"},
    {"id":"role","type":"string","label":"Role","default":"Lead Architect & Systems"},
    {"id":"power","type":"string","label":"Superpower","default":"Zero-Latency Vision"},
    {"id":"primary","type":"color","label":"Primary","default":"#ff5c35"},
    {"id":"accent","type":"color","label":"Accent","default":"#ffd600"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=768, height=1024" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Modak"; src: url("assets/fonts/Modak.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-var.woff2") format("woff2"); font-weight: 100 900; }
      :root {
        --ink: #252422;
        --cream: #f4f0ed;
        --sky-top: #ffd0bf;
        --sky-bot: #fff4c7;
        --sky-alt: #ffe9b0;
        --sun: #ffd600;
        --hill-1: #ffb39f;
        --hill-2: #ff8a6b;
        --hill-3: #ff5c35;
        --body: #ff5c35;
        --title: #7a2410;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 768px; height: 1024px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      .layer { position: absolute; inset: 0; }
      #sky { background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%); }
      #sky-alt { background: linear-gradient(180deg, var(--sky-alt) 0%, transparent 70%); opacity: 0; }
      #sun { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: var(--sun); left: 400px; top: 330px; }
      .cloud { position: absolute; height: 54px; border-radius: 40px; background: #fff; opacity: .92; }
      .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
      .cloud::before { width: 70px; height: 70px; left: 26px; top: -34px; }
      .cloud::after { width: 52px; height: 52px; left: 80px; top: -22px; }
      #hills svg.hill { position: absolute; left: -40px; width: 848px; bottom: 0; }
      #critter { position: absolute; left: 50%; bottom: 210px; width: 250px; height: 250px; margin-left: -125px; transform-origin: 50% 100%; }
      #star { position: absolute; left: 520px; bottom: 470px; width: 74px; height: 74px; }
      .spark { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.06); }
      #title {
        position: absolute; left: 0; right: 0; top: 96px; text-align: center;
        font-family: "Modak", sans-serif; font-size: 190px; line-height: .8; color: var(--title);
        letter-spacing: -2px; white-space: nowrap;
      }
      #title span { display: inline-block; transform-origin: 50% 100%; }
      #index { position: absolute; left: 44px; top: 40px; font-weight: 700; font-size: 26px; color: var(--title); opacity: .55; letter-spacing: -.5px; }
      #power { position: absolute; right: 44px; top: 42px; font-weight: 700; font-size: 20px; color: var(--title); opacity: .55; text-transform: lowercase; letter-spacing: -.4px; }
      #role {
        position: absolute; left: 0; right: 0; bottom: 60px; text-align: center;
        font-weight: 800; font-size: 30px; letter-spacing: -1px; color: #fff; text-transform: lowercase;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="card" data-start="0" data-duration="6" data-width="768" data-height="1024" data-fps="30">
      <div id="scene" class="clip layer" data-start="0" data-duration="6" data-track-index="0">
        <div id="sky" class="layer"></div>
        <div id="sky-alt" class="layer"></div>
        <div id="sun"></div>
        <div id="cloud-a" class="cloud" style="left:90px;top:300px;width:170px"></div>
        <div id="cloud-b" class="cloud" style="left:470px;top:300px;width:140px;transform:scale(.8)"></div>
        <div id="sparks" class="layer"></div>
        <div id="hills" class="layer">
          <svg class="hill" id="hill-1" viewBox="0 0 848 520" height="520"><path fill="var(--hill-1)" d="M0 220 C120 120 240 110 360 190 C480 270 600 120 848 150 L848 520 L0 520Z"/></svg>
          <svg class="hill" id="hill-2" viewBox="0 0 848 400" height="400"><path fill="var(--hill-2)" d="M0 170 C150 60 300 80 420 150 C540 220 680 90 848 120 L848 400 L0 400Z"/></svg>
          <svg id="star" viewBox="0 0 100 100"><path fill="#fff" d="M50 0 C55 35 65 45 100 50 C65 55 55 65 50 100 C45 65 35 55 0 50 C35 45 45 35 50 0Z"/></svg>
          <svg id="critter" viewBox="0 0 250 250">
            <path id="critter-body" fill="var(--body)" d="M30 250 C10 160 40 60 125 55 C210 60 240 160 220 250Z"/>
            <ellipse cx="125" cy="250" rx="98" ry="10" fill="rgba(0,0,0,.12)"/>
            <g id="eyes">
              <ellipse cx="95" cy="140" rx="17" ry="22" fill="#fff"/><ellipse cx="155" cy="140" rx="17" ry="22" fill="#fff"/>
              <circle id="pupil-l" cx="98" cy="145" r="8" fill="#252422"/><circle id="pupil-r" cx="158" cy="145" r="8" fill="#252422"/>
            </g>
            <path d="M108 185 Q125 200 142 185" stroke="#252422" stroke-width="6" fill="none" stroke-linecap="round"/>
            <circle cx="75" cy="178" r="10" fill="#fff" opacity=".35"/><circle cx="175" cy="178" r="10" fill="#fff" opacity=".35"/>
          </svg>
          <svg class="hill" id="hill-3" viewBox="0 0 848 260" height="260"><path fill="var(--hill-3)" d="M0 90 C170 20 330 40 440 80 C560 120 700 30 848 60 L848 260 L0 260Z"/></svg>
        </div>
        <div id="title"></div>
        <div id="index"></div>
        <div id="power"></div>
        <div id="role"></div>
      </div>
    </div>
    <script>
      // ---- variables (per-member, injected via `hyperframes render --variables`) ----
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const idx = Number(v.index || 0);

      const hex = (h) => { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
      const toHex = (c) => "#" + c.map((x) => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, "0")).join("");
      const mix = (a, b, t) => toHex(hex(a).map((x, i) => x + (hex(b)[i] - x) * t));
      const luma = (h) => { const [r, g, b] = hex(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };

      // Justine-style palette: pastel sky, saturated layered hills, deep ink title.
      const P = v.primary || "#ff5c35";
      const A = (v.accent && luma(v.accent) > 0.15) ? v.accent : mix(P, "#ffffff", 0.5);
      const root = document.documentElement.style;
      root.setProperty("--sky-top", mix(P, "#ffffff", 0.62));
      root.setProperty("--sky-bot", mix(A, "#f4f0ed", 0.72));
      root.setProperty("--sky-alt", mix(A, "#ffffff", 0.45));
      root.setProperty("--sun", mix(A, "#ffffff", 0.15));
      root.setProperty("--hill-1", mix(P, "#ffffff", 0.5));
      root.setProperty("--hill-2", mix(P, "#ffffff", 0.22));
      root.setProperty("--hill-3", P);
      root.setProperty("--body", mix(P, "#252422", 0.18));
      root.setProperty("--title", mix(P, "#1a1918", 0.62));

      const first = (v.first || "Alex").toLowerCase();
      const titleEl = document.getElementById("title");
      titleEl.innerHTML = [...first].map((c) => `<span>${c}</span>`).join("");
      if (first.length > 6) titleEl.style.fontSize = Math.round(190 * 6 / first.length) + "px";
      document.getElementById("index").textContent = "0" + (idx + 1);
      document.getElementById("power").textContent = v.power || "";
      document.getElementById("role").textContent = v.role || "";

      // Deterministic sparkles (seeded by index, no Math.random)
      const rand = (n) => { const x = Math.sin(n * 127.1 + idx * 311.7) * 43758.5453; return x - Math.floor(x); };
      const sparks = [];
      const sparkLayer = document.getElementById("sparks");
      for (let i = 0; i < 16; i++) {
        const el = document.createElement("div");
        el.className = "spark";
        const s = 0.4 + rand(i + 1) * 0.8;
        el.style.width = el.style.height = 12 * s + "px";
        sparkLayer.appendChild(el);
        sparks.push({ el, x: rand(i + 20) * 768, phase: rand(i + 40), speed: rand(i + 60) < 0.5 ? 1 : 2, sway: 10 + rand(i + 80) * 20 });
      }

      // ---- one seekable master phase: every motion is periodic in t∈[0,1] -> seamless 6s loop ----
      const TAU = Math.PI * 2;
      const letters = [...titleEl.children];
      const $ = (id) => document.getElementById(id);
      const els = { sun: $("sun"), skyAlt: $("sky-alt"), ca: $("cloud-a"), cb: $("cloud-b"), h1: $("hill-1"), h2: $("hill-2"), h3: $("hill-3"), critter: $("critter"), eyes: $("eyes"), pl: $("pupil-l"), pr: $("pupil-r"), star: $("star"), role: $("role") };

      function render(t) {
        const w = (n, ph = 0) => Math.sin(TAU * (n * t + ph));
        els.skyAlt.style.opacity = (0.5 + 0.5 * w(1)) * 0.7;               // her uColor mix: abs(sin(uTime*.4))
        els.sun.style.transform = `scale(${1 + 0.05 * w(2)})`;
        els.ca.style.transform = `translateX(${28 * w(1)}px)`;
        els.cb.style.transform = `translateX(${-22 * w(1, 0.3)}px) scale(.8)`;
        els.h1.style.transform = `translateX(${10 * w(1)}px)`;
        els.h2.style.transform = `translateX(${-14 * w(1, 0.2)}px)`;
        els.h3.style.transform = `translateX(${8 * w(2, 0.1)}px)`;
        // powerInOut squash & stretch bounce, 4 hops per loop
        const hop = Math.abs(w(2));
        const sy = 1 - Math.pow(1 - hop, 3) * 0.12;
        els.critter.style.transform = `translateY(${-hop * 34}px) scale(${2 - sy}, ${sy})`;
        // blink twice per loop
        const blink = [0.32, 0.81].some((b) => Math.abs(t - b) < 0.018) ? 0.1 : 1;
        els.eyes.style.transform = `scaleY(${blink})`; els.eyes.style.transformOrigin = "125px 140px";
        const look = 5 * w(1, 0.15);
        els.pl.setAttribute("cx", 98 + look); els.pr.setAttribute("cx", 158 + look);
        els.star.style.transform = `rotate(${t * 360}deg) scale(${1 + 0.15 * w(3)})`;
        letters.forEach((el, i) => {
          el.style.transform = `translateY(${-10 * w(2, i * 0.09)}px) scaleY(${1 + 0.04 * w(2, i * 0.09 + 0.25)})`;
        });
        sparks.forEach((s) => {
          const y = ((t * s.speed + s.phase) % 1) * 1100 - 60;
          s.el.style.transform = `translate(${s.x + s.sway * w(s.speed, s.phase)}px, ${y}px)`;
        });
      }

      const phase = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(phase, { t: 1, duration: 6, ease: "none", onUpdate: () => render(phase.t % 1) }, 0);
      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["card"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
